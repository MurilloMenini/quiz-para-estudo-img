    </g>
    <text x="140" y="350" fill="#4c1d95" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Ãcino Seroso (Escuro)</text>
  </g>

  <!-- RIGHT: Mucous Acinus (Pale cytoplasm, Flat basal nucleus) -->
  <g transform="translate(310, 0)">
    <circle cx="140" cy="200" r="110" fill="#fbcfe8" stroke="#db2777" stroke-width="5"/>
